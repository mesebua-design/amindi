<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ludex — Multiplayer Card Games (Live)</title>
<meta name="description" content="Jump into free multiplayer Blackjack and Poker. No sign-up — just a nickname and a seat.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23100D0A'/%3E%3Cpath d='M50 16 L80 50 L50 84 L20 50 Z' fill='%23C9A24B'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="#/home" class="skip-link">Skip to content</a>

<!-- Toast notifications -->
<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

<!-- ============ HEADER / NAV ============ -->
<header class="site-header" id="site-header">
  <div class="header-inner">

    <a href="#/home" class="brand" data-route="/home" aria-label="Ludex home">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="24" fill="var(--panel-raised)"/>
        <path d="M50 18 L80 50 L50 82 L20 50 Z" fill="var(--brass)"/>
      </svg>
      <span class="brand-name">Ludex</span>
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Primary">
      <a href="#/home" data-route="/home">Home</a>
      <a href="#/games" data-route="/games">Games</a>
      <a href="#/rooms" data-route="/rooms">Public Rooms</a>
      <a href="#/create-private" data-route="/create-private">Create Private</a>
      <a href="#/join-private" data-route="/join-private">Join Private</a>
    </nav>

    <div class="header-actions">
      <div class="presence-pill" id="header-presence" title="Players online right now">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span id="header-online-count" class="mono">—</span>
        <span class="presence-label">online</span>
      </div>

      <div class="nickname-pill" id="nickname-pill"><!-- filled by JS --></div>

      <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</header>

<!-- ============ APP ROOT (views are rendered here by the router) ============ -->
<main id="app-root" class="app-root"></main>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="modal-backdrop"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>Ludex — no accounts, no downloads, just a table.</span>
    <span class="suit-flourish" aria-hidden="true">♠ ♥ ♦ ♣</span>
  </div>
</footer>

<noscript>
  <div style="padding:3rem;text-align:center;font-family:sans-serif;color:#EDE6D6;background:#100D0A;">
    Ludex needs JavaScript enabled to deal you in. Please enable it and reload.
  </div>
</noscript>

<script src="client.js"></script>
</body>
</html>
