<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>საქართველოს ამინდი</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --secondary: #06b6d4;
            --accent: #f97316;
            --dark: #0f172a;
            --light: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-light);
            overflow-x: hidden;
            transition: background 1s ease;
            min-height: 100vh;
        }

        body.dark {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
        }

        body.sunny {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
        }

        body.rainy {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
        }

        body.cloudy {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        }

        body.snowy {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            opacity: 0.4;
        }

        .cloud::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            top: -30px;
            left: 10px;
        }

        .cloud::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            top: -25px;
            right: 10px;
        }

        .cloud1 { animation: float 20s infinite; }
        .cloud2 { animation: float 25s infinite 2s; }
        .cloud3 { animation: float 30s infinite 4s; }

        @keyframes float {
            0% { transform: translateX(-100vw); }
            100% { transform: translateX(100vw); }
        }

        .rain-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            animation: fall 1s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 1.5em;
            opacity: 0.8;
            animation: snowfall 10s linear infinite;
        }

        @keyframes snowfall {
            to { transform: translateY(100vh) rotateZ(360deg); }
        }

        /* ========== CITY SELECTION SCREEN ========== */
        .city-selection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .city-selection.hidden {
            display: none;
        }

        .city-selection-container {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-selection-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .city-selection-logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .city-selection-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .city-selection-subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .city-error-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            backdrop-filter: blur(10px);
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fecaca;
            padding: 14px 22px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
            animation: slideUp 0.3s ease;
        }

        .city-error-banner.show {
            display: flex;
        }

        .city-error-close {
            flex-shrink: 0;
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
            padding: 0 4px;
            transition: opacity 0.2s ease;
        }

        .city-error-close:hover {
            opacity: 1;
        }

        .city-search-box {
            backdrop-filter: blur(10px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 50px;
            color: var(--text-light);
            width: 100%;
            font-size: 16px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .city-search-box:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .city-group-title {
            font-size: 13px;
            font-weight: 700;
            margin: 35px 0 15px;
            opacity: 0.6;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            position: relative;
        }

        .city-group-title::before,
        .city-group-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .city-group-title::before { left: 0; }
        .city-group-title::after { right: 0; }

        .city-group-title:first-child {
            margin-top: 0;
        }

        .city-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .city-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.2);
        }

        .city-card.hidden {
            display: none;
        }

        .city-card-emoji {
            font-size: 32px;
        }

        .city-card-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .city-card-temp {
            font-size: 14px;
            opacity: 0.7;
        }

        /* ========== WEATHER DETAIL SCREEN ========== */
        .weather-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .weather-screen.active {
            display: flex;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            width: 100%;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
        }

        .city-switcher-select {
            flex: 1 1 260px;
            min-width: 220px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5 7l5 6 5-6H5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 18px center;
            background-size: 14px;
        }

        .city-switcher-select:hover,
        .city-switcher-select:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: rgba(255, 255, 255, 0.5);
            outline: none;
        }

        .city-switcher-select option {
            background: #0f172a;
            color: #ffffff;
        }

        /* Current Weather */
        .current-weather {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 30px;
        }

        .weather-icon {
            font-size: 120px;
            text-align: center;
            animation: float-icon 3s ease-in-out infinite;
        }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .weather-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .city-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
        }

        .weather-desc {
            font-size: 24px;
            opacity: 0.9;
            text-transform: capitalize;
        }

        .feels-like {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Avatar Section */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .avatar-container {
            width: 180px;
            height: 300px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-body {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .avatar-head {
            font-size: 60px;
            animation: headBob 2s ease-in-out infinite;
        }

        @keyframes headBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .avatar-outfit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 30px;
            animation: outfitRotate 3s ease-in-out infinite;
        }

        @keyframes outfitRotate {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(-1); }
        }

        .avatar-label {
            font-size: 12px;
            opacity: 0.8;
            text-align: center;
            margin-top: 10px;
        }

        /* Weather Details Grid */
        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .detail-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .detail-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .detail-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Wind Card - Prominent */
        .wind-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(100, 150, 255, 0.1));
            border: 2px solid rgba(100, 200, 255, 0.3);
        }

        .wind-card .detail-value {
            font-size: 32px;
        }

        /* Roast Section */
        .roast-section {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(59, 130, 246, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .roast-icon {
            font-size: 60px;
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .roast-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
        }

        /* Recommendations */
        .recommendations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .recommendation-card {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
        }

        .recommendation-card h3 {
            font-size: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .outfit-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .outfit-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 16px;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .outfit-item:nth-child(1) { animation-delay: 0.1s; }
        .outfit-item:nth-child(2) { animation-delay: 0.2s; }
        .outfit-item:nth-child(3) { animation-delay: 0.3s; }
        .outfit-item:nth-child(4) { animation-delay: 0.4s; }
        .outfit-item:nth-child(5) { animation-delay: 0.5s; }

        .chances-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chance-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        .chance-item:nth-child(1) { animation-delay: 0.1s; }
        .chance-item:nth-child(2) { animation-delay: 0.2s; }
        .chance-item:nth-child(3) { animation-delay: 0.3s; }
        .chance-item:nth-child(4) { animation-delay: 0.4s; }
        .chance-item:nth-child(5) { animation-delay: 0.5s; }

        .chance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .chance-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 15px;
        }

        .chance-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 10px;
        }

        .chance-percent {
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        /* Forecasts */
        .forecasts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .forecast-card {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
        }

        .forecast-card h3 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .daily-forecast {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .daily-item {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .daily-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .daily-day {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .daily-icon {
            font-size: 28px;
            margin: 8px 0;
        }

        .daily-high {
            font-weight: 700;
            font-size: 16px;
        }

        .daily-low {
            opacity: 0.7;
            font-size: 14px;
        }

        .daily-rain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 12px;
            margin-top: 5px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .current-weather {
                grid-template-columns: 1fr 1fr;
            }

            .avatar-section {
                grid-column: 1 / -1;
            }

            .cities-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .current-weather {
                grid-template-columns: 1fr;
                padding: 25px;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .daily-forecast {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .roast-section {
                flex-direction: column;
                text-align: center;
            }

            .recommendations {
                grid-template-columns: 1fr;
            }

            .cities-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .avatar-container {
                width: 150px;
                height: 250px;
            }

            .avatar-head {
                font-size: 48px;
            }

            .avatar-outfit {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .weather-icon {
                font-size: 80px;
            }

            .temperature {
                font-size: 48px;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .detail-card {
                padding: 15px;
            }

            .cities-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .recommendation-card {
                padding: 20px;
            }

            .daily-forecast {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            }

            .avatar-container {
                width: 120px;
                height: 200px;
            }

            .avatar-head {
                font-size: 36px;
            }

            .avatar-outfit {
                font-size: 18px;
            }

            .roast-icon {
                font-size: 40px;
            }

            .roast-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="rain-container" id="rainContainer"></div>
        <div id="snowContainer"></div>
    </div>

    <!-- ========== CITY SELECTION SCREEN ========== -->
    <div class="city-selection" id="citySelection">
        <div class="city-selection-container">
            <div class="city-selection-header">
                <div class="city-selection-logo">🌤️</div>
                <div class="city-selection-title">საქართველოს ამინდი</div>
                <div class="city-selection-subtitle">აირჩიეთ ქალაქი ამინდის სანახავად</div>
            </div>

            <div class="city-error-banner" id="cityErrorBanner">
                <span id="cityErrorText"></span>
                <button class="city-error-close" onclick="hideCityError()" aria-label="Dismiss">✕</button>
            </div>

            <input 
                type="text"

        function formatUnixTime(unixSeconds, tzOffsetSeconds) {
            // OpenWeather gives sunrise/sunset as UTC unix timestamps plus a
            // timezone offset (seconds) for the city itself.
            const localMs = (unixSeconds + tzOffsetSeconds) * 1000;
            const d = new Date(localMs);
            let hours = d.getUTCHours();
            const minutes = d.getUTCMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            if (hours === 0) hours = 12;
            const minutesStr = minutes < 10 ? '0' + minutes : minutes;
            return `${hours}:${minutesStr} ${ampm}`;
        }

        // ========== FETCH WEATHER (OpenWeather API) ==========
        // Free-tier friendly: Current Weather + 5 day/3-hour Forecast + Air Pollution.
        // (OpenWeather's One Call 3.0 API needs a card on file even on the free
        // tier, so we avoid it and build daily forecast cards ourselves from the
        // 3-hourly data instead.)
        async function fetchWeather(cityQuery, displayName) {
            try {
                console.log('Fetching weather for:', cityQuery);
                const currentUrl = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cityQuery)}&appid=${API_KEY}&units=metric&lang=ka`;

                const currentRes = await fetch(currentUrl);
                const currentData = await currentRes.json();
                if (!currentRes.ok) {
                    throw new Error((currentData && currentData.message) ? currentData.message : `Request failed (HTTP ${currentRes.status})`);
                }

                // Use the coordinates OpenWeather resolved for this city so the
                // forecast and air-quality calls line up exactly with "current".
                const { lat, lon } = currentData.coord;
                const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ka`;
                const aqiUrl = `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`;

                const [forecastRes, aqiRes] = await Promise.all([
                    fetch(forecastUrl),
                    fetch(aqiUrl),
                ]);

                const forecastData = await forecastRes.json();
                if (!forecastRes.ok) {
                    throw new Error((forecastData && forecastData.message) ? forecastData.message : `Forecast request failed (HTTP ${forecastRes.status})`);
                }

                // Air quality is a nice-to-have; don't fail the whole screen if it errors.
                let aqiData = null;
                if (aqiRes.ok) {
                    aqiData = await aqiRes.json();
                }

                displayWeather(currentData, forecastData, displayName, cityQuery, aqiData);
                showWeatherScreen();
            } catch (error) {
                console.error('Weather fetch error:', error);
                showCityError(displayName || cityQuery, error.message || 'Unknown error');
            }
        }

        // ========== CITY ERROR BANNER ==========
        let cityErrorTimeout;

        function showCityError(cityName, message) {
            const banner = document.getElementById('cityErrorBanner');
            const text = document.getElementById('cityErrorText');
            text.textContent = `Couldn't load weather for ${cityName}: ${message}`;
            banner.classList.add('show');
            clearTimeout(cityErrorTimeout);
            cityErrorTimeout = setTimeout(hideCityError, 7000);
        }

        function hideCityError() {
            document.getElementById('cityErrorBanner').classList.remove('show');
        }

        // Group OpenWeather's 3-hourly forecast list into daily buckets
        // (min/max temp, worst rain chance, a representative condition).
        function buildDailyForecast(list) {
            const days = {};
            list.forEach(entry => {
                const dateKey = entry.dt_txt.split(' ')[0];
                if (!days[dateKey]) {
                    days[dateKey] = {
                        date: dateKey,
                        maxtemp_c: entry.main.temp_max,
                        mintemp_c: entry.main.temp_min,
                        rainChances: [],
                        conditions: [],
                    };
                }
                const day = days[dateKey];
                day.maxtemp_c = Math.max(day.maxtemp_c, entry.main.temp_max);
                day.mintemp_c = Math.min(day.mintemp_c, entry.main.temp_min);
                day.rainChances.push(Math.round((entry.pop || 0) * 100));
                day.conditions.push(entry.weather[0].main);
            });

            return Object.values(days).map(day => {
                // Most frequent condition for that day
                const counts = {};
                day.conditions.forEach(c => counts[c] = (counts[c] || 0) + 1);
                const mainCondition = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
                return {
                    date: day.date,
                    maxtemp_c: day.maxtemp_c,
                    mintemp_c: day.mintemp_c,
                    rainChance: Math.max(...day.rainChances),
                    condition: mainCondition,
                };
            });
        }

        // ========== AIR QUALITY ==========
        function getAqiInfo(aqi) {
            const map = {
                1: { label: 'კარგი', emoji: '🟢' },
                2: { label: 'დამაკმაყოფილებელი', emoji: '🟡' },
                3: { label: 'ზომიერი', emoji: '🟠' },
                4: { label: 'ცუდი', emoji: '🔴' },
                5: { label: 'ძალიან ცუდი', emoji: '🟣' },
            };
            return map[aqi] || { label: 'უცნობია', emoji: '⚪' };
        }

        // ========== THUNDERSTORM RISK ==========
        // Looks at the next 24h (8 x 3-hour slots) of forecast data for
        // thunderstorm condition codes (200-232) and their rain probability.
        function getThunderRisk(forecastList, currentWeatherId) {
            const next24h = (forecastList || []).slice(0, 8);
            let maxPop = 0;
            let hasThunderCode = currentWeatherId >= 200 && currentWeatherId < 300;

            next24h.forEach(entry => {
                const id = entry.weather[0].id;
                if (id >= 200 && id < 300) {
                    hasThunderCode = true;
                    maxPop = Math.max(maxPop, entry.pop || 0);
                }
            });

            const pct = Math.round(maxPop * 100);
            let level, emoji;
            if (!hasThunderCode || pct < 20) {
                level = 'დაბალი'; emoji = '🌤️';
            } else if (pct < 50) {
                level = 'ზომიერი'; emoji = '⛈️';
            } else {
                level = 'მაღალი'; emoji = '⚡';
            }
            return { level, pct, emoji };
        }

        // ========== DOG WALK SCORE ==========
        function getDogWalkScore(temp, rainChance, windKph, aqi) {
            let score = 100;
            const reasons = [];

            if (temp > 28) { score -= 35; reasons.push('ძალიან ცხელა თათებისთვის'); }
            else if (temp > 25) { score -= 15; reasons.push('ცოტა ცხელა'); }
            else if (temp < 0) { score -= 35; reasons.push('ყინვაა'); }
            else if (temp < 5) { score -= 15; reasons.push('საკმაოდ ცივა'); }

            if (rainChance > 70) { score -= 30; reasons.push('წვიმის მაღალი ალბათობა'); }
            else if (rainChance > 40) { score -= 15; reasons.push('შესაძლო წვიმა'); }

            if (windKph > 40) { score -= 15; reasons.push('ძლიერი ქარი'); }

            if (typeof aqi === 'number') {
                if (aqi >= 4) { score -= 20; reasons.push('ჰაერის ცუდი ხარისხი'); }
                else if (aqi === 3) { score -= 10; reasons.push('ჰაერის ზომიერი ხარისხი'); }
            }

            score = Math.max(0, Math.min(100, score));

            let label, emoji;
            if (score >= 80) { label = 'შესანიშნავი დროა სასეირნოდ'; emoji = '🐕✅'; }
            else if (score >= 60) { label = 'კარგია, მცირე გაფრთხილებით'; emoji = '🐕'; }
            else if (score >= 35) { label = 'დასაშვებია, მაგრამ მოემზადეთ'; emoji = '🐕⚠️'; }
            else { label = 'სჯობს დღეს გამოტოვოთ'; emoji = '🐕🚫'; }

            return { score, label, emoji, reasons };
        }

        // ========== COMPARE TO YESTERDAY ==========
        // Uses localStorage to remember what a city's weather looked like the
        // last time this page was opened, and compares it to today. Since the
        // free API tier has no real historical data, this rolls forward day by
        // day rather than pulling an actual "yesterday" record on first use.
        function getLocalDateStr(tzOffsetSeconds) {
            const localMs = (Math.floor(Date.now() / 1000) + tzOffsetSeconds) * 1000;
            return new Date(localMs).toISOString().split('T')[0];
        }

        function updateYesterdayComparison(cityQuery, temp, condition, todayDateStr) {
            const key = 'georgiaWeatherHistory:' + cityQuery;
            let comparisonText = 'No data from yesterday yet — check back tomorrow.';

            try {
                const stored = localStorage.getItem(key);
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.date !== todayDateStr) {
                        const diff = Math.round(temp - data.temp);
                        if (diff > 0) comparisonText = `🔺 ${diff}° warmer than yesterday (was ${Math.round(data.temp)}°, ${data.condition})`;
                        else if (diff < 0) comparisonText = `🔻 ${Math.abs(diff)}° colder than yesterday (was ${Math.round(data.temp)}°, ${data.condition})`;
                        else comparisonText = `➡️ Same temperature as yesterday (${data.condition})`;
                    } else {
                        // Already recorded today — keep showing the last comparison we made.
                        return data.comparisonText || comparisonText;
                    }
                }
                localStorage.setItem(key, JSON.stringify({ date: todayDateStr, temp, condition, comparisonText }));
            } catch (e) {
                comparisonText = 'Comparison unavailable in this browser.';
            }

            return comparisonText;
        }

        function displayWeather(current, forecast, displayName, cityQuery, aqiData) {
            currentCity = displayName || current.name;
            if (cityQuery) populateCitySwitcher(cityQuery);
            const tzOffset = current.timezone || 0;
            const dailyForecast = buildDailyForecast(forecast.list);
            const todayRainChance = dailyForecast.length ? dailyForecast[0].rainChance : 0;
            const windSpeedKph = (current.wind.speed || 0) * 3.6; // m/s -> km/h

            const aqiValue = (aqiData && aqiData.list && aqiData.list[0]) ? aqiData.list[0].main.aqi : null;
            const aqiInfo = Object.assign({ value: aqiValue }, aqiValue ? getAqiInfo(aqiValue) : { label: 'Unavailable', emoji: '⚪' });
            const thunderRisk = getThunderRisk(forecast.list, current.weather[0].id);

            // Current weather
            document.getElementById('cityName').textContent = (displayName || current.name) + ', ' + (current.sys.country || '');
            document.getElementById('temperature').textContent = Math.round(current.main.temp) + '°';
            document.getElementById('weatherDesc').textContent = current.weather[0].description;
            document.getElementById('feelsLike').textContent = `Feels like ${Math.round(current.main.feels_like)}°`;
            document.getElementById('weatherIcon').textContent = getWeatherIcon(current.weather[0].main);

            const rainDesc = getRainDescription(todayRainChance);
            const windDesc = getWindDescription(windSpeedKph);

            // Avatar outfit
            const avatarOutfit = getAvatarOutfit(current.main.temp, todayRainChance);
            document.getElementById('avatarOutfit').textContent = avatarOutfit;

            const sunriseText = current.sys.sunrise ? formatUnixTime(current.sys.sunrise, tzOffset) : '-';
            const sunsetText = current.sys.sunset ? formatUnixTime(current.sys.sunset, tzOffset) : '-';

            // Weather details with WIND prominently displayed
            // (UV index isn't available on OpenWeather's free current-weather
            // endpoint, so that card is omitted here.)
            const detailsHTML = `
                <div class="detail-card">
                    <div class="detail-icon">💧</div>
                    <div class="detail-value">${current.main.humidity}%</div>
                    <div class="detail-label">Humidity</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🌧️</div>
                    <div class="detail-value">${todayRainChance}%</div>
                    <div class="detail-label">Rain (${rainDesc})</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🔽</div>
                    <div class="detail-value">${Math.round(current.main.pressure)}</div>
                    <div class="detail-label">Pressure (mb)</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">👁️</div>
                    <div class="detail-value">${current.visibility ? Math.round(current.visibility / 1000) : '-'}</div>
                    <div class="detail-label">Visibility (km)</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🌅</div>
                    <div class="detail-value" style="font-size: 16px;">${sunriseText}</div>
                    <div class="detail-label">Sunrise</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🌇</div>
                    <div class="detail-value" style="font-size: 16px;">${sunsetText}</div>
                    <div class="detail-label">Sunset</div>
                </div>
                <div class="detail-card wind-card">
                    <div class="detail-icon">💨</div>
                    <div class="detail-value">${Math.round(windSpeedKph)} km/h</div>
                    <div class="detail-label">${windDesc}</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">${aqiInfo.emoji}</div>
                    <div class="detail-value">${aqiInfo.label}</div>
                    <div class="detail-label">Air Quality</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">${thunderRisk.emoji}</div>
                    <div class="detail-value">${thunderRisk.level}</div>
                    <div class="detail-label">Thunderstorm Risk (${thunderRisk.pct}%)</div>
                </div>
            `;
            document.getElementById('weatherDetails').innerHTML = detailsHTML;

            // Roast
            const roast = getWeatherRoast(current.main.temp, current.weather[0].main, todayRainChance);
            const roastParts = roast.match(/(\S+)\s"(.+)"/);
            if (roastParts) {
                document.getElementById('roastIcon').textContent = roastParts[1];
                document.getElementById('roastText').textContent = roastParts[2];
            }

            // Dog Walk Score
            const dogWalk = getDogWalkScore(current.main.temp, todayRainChance, windSpeedKph, aqiInfo.value);
            document.getElementById('dogWalkIcon').textContent = dogWalk.emoji;
            document.getElementById('dogWalkText').textContent = dogWalk.reasons.length
                ? `${dogWalk.label} (score ${dogWalk.score}/100) — watch out for: ${dogWalk.reasons.join(', ')}.`
                : `${dogWalk.label} (score ${dogWalk.score}/100). Conditions look ideal.`;

            // Compared to Yesterday
            const todayDateStr = getLocalDateStr(tzOffset);
            const comparisonText = updateYesterdayComparison(cityQuery || current.name, current.main.temp, current.weather[0].description, todayDateStr);
            document.getElementById('yesterdayCompare').textContent = comparisonText;

            // Forecast
            document.getElementById('forecastTitle').textContent = `📅 ${dailyForecast.length}-Day Forecast`;
            const dailyHTML = dailyForecast.map(day => {
                const date = new Date(day.date + 'T00:00:00');
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return `
                    <div class="daily-item">
                        <div class="daily-day">${dayName}<br>${dayDate}</div>
                        <div class="daily-icon">${getWeatherIcon(day.condition)}</div>
                        <div>
                            <div class="daily-high">${Math.round(day.maxtemp_c)}°</div>
                            <div class="daily-low">${Math.round(day.mintemp_c)}°</div>
                        </div>
                        <div class="daily-rain">🌧️${day.rainChance}%</div>
                    </div>
                `;
            }).join('');
            document.getElementById('dailyForecast').innerHTML = dailyHTML;

            // Update background
            updateBackgroundTheme(current.weather[0].main, current.main.temp);

            // Animations
            if (todayRainChance > 50) {
                createRainAnimation();
            } else {
                document.getElementById('rainContainer').style.opacity = '0';
            }

            if (current.main.temp < 0) {
                createSnowAnimation();
            } else {
                document.getElementById('snowContainer').innerHTML = '';
            }
        }

        // ========== SCREEN NAVIGATION ==========
        function showWeatherScreen() {
            document.getElementById('citySelection').classList.add('hidden');
            document.getElementById('weatherScreen').classList.add('active');
        }

        function goBackToCities() {
            document.getElementById('weatherScreen').classList.remove('active');
            document.getElementById('citySelection').classList.remove('hidden');
        }

        function onCitySwitcherChange(query) {
            if (!query) return;
            const city = ALL_CITIES.find(c => c.query === query);
            fetchWeather(query, city ? city.name : query);
        }

        function populateCitySwitcher(selectedQuery) {
            const switcher = document.getElementById('citySwitcher');
            switcher.innerHTML =
                '<optgroup label="🇬🇪 ქართული ქალაქები">' +
                GEORGIA_CITIES.map(city =>
                    `<option value="${city.query}" ${city.query === selectedQuery ? 'selected' : ''}>${city.emoji} ${city.name}</option>`
                ).join('') +
                '</optgroup>' +
                '<optgroup label="🌍 უცხოეთის ქალაქები">' +
                INTERNATIONAL_CITIES.map(city =>
                    `<option value="${city.query}" ${city.query === selectedQuery ? 'selected' : ''}>${city.emoji} ${city.name}</option>`
                ).join('') +
                '</optgroup>';
        }

        // ========== CITY SELECTION INIT ==========
        function initializeCities() {
            const grid = document.getElementById('citiesGrid');
            const searchInput = document.getElementById('citySearchInput');

            function renderCities(georgianList, internationalList) {
                const combined = [...georgianList, ...internationalList];
                grid.innerHTML = combined.map(city => `
                    <div class="city-card" onclick="fetchWeather('${city.query}', '${city.name}')">
                        <div class="city-card-emoji">${city.emoji}</div>
                        <div class="city-card-name">${city.name}</div>
                    </div>
                `).join('');
            }

            renderCities(GEORGIA_CITIES, INTERNATIONAL_CITIES);
            populateCitySwitcher();

            // Search functionality (matches Georgian display name or the English query name)
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const matches = city => city.name.toLowerCase().includes(term) || city.query.toLowerCase().includes(term);
                renderCities(GEORGIA_CITIES.filter(matches), INTERNATIONAL_CITIES.filter(matches));
            });

            // Default to Tbilisi on first load
            const tbilisi = GEORGIA_CITIES.find(c => c.query === 'Tbilisi,GE');
            if (tbilisi) {
                fetchWeather(tbilisi.query, tbilisi.name);
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initializeCities);
    </script>
</body>
