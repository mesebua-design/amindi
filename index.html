<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgia Weather</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --secondary: #06b6d4;
            --accent: #f97316;
            --dark: #0f172a;
            --light: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-light);
            overflow-x: hidden;
            transition: background 1s ease;
            min-height: 100vh;
        }

        body.dark {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
        }

        body.sunny {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
        }

        body.rainy {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
        }

        body.cloudy {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        }

        body.snowy {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            opacity: 0.4;
        }

        .cloud::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            top: -30px;
            left: 10px;
        }

        .cloud::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            top: -25px;
            right: 10px;
        }

        .cloud1 { animation: float 20s infinite; }
        .cloud2 { animation: float 25s infinite 2s; }
        .cloud3 { animation: float 30s infinite 4s; }

        @keyframes float {
            0% { transform: translateX(-100vw); }
            100% { transform: translateX(100vw); }
        }

        .rain-container {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            animation: fall 1s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 1.5em;
            opacity: 0.8;
            animation: snowfall 10s linear infinite;
        }

        @keyframes snowfall {
            to { transform: translateY(100vh) rotateZ(360deg); }
        }

        /* ========== CITY SELECTION SCREEN ========== */
        .city-selection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .city-selection.hidden {
            display: none;
        }

        .city-selection-container {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-selection-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .city-selection-logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .city-selection-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .city-selection-subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .city-search-box {
            backdrop-filter: blur(10px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 50px;
            color: var(--text-light);
            width: 100%;
            font-size: 16px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .city-search-box:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .city-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .city-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.2);
        }

        .city-card.hidden {
            display: none;
        }

        .city-card-emoji {
            font-size: 32px;
        }

        .city-card-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .city-card-temp {
            font-size: 14px;
            opacity: 0.7;
        }

        /* ========== WEATHER DETAIL SCREEN ========== */
        .weather-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .weather-screen.active {
            display: flex;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            width: 100%;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
        }

        /* Current Weather */
        .current-weather {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 30px;
        }

        .weather-icon {
            font-size: 120px;
            text-align: center;
            animation: float-icon 3s ease-in-out infinite;
        }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .weather-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .city-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
        }

        .weather-desc {
            font-size: 24px;
            opacity: 0.9;
            text-transform: capitalize;
        }

        .feels-like {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Avatar Section */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .avatar-container {
            width: 180px;
            height: 300px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-body {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .avatar-head {
            font-size: 60px;
            animation: headBob 2s ease-in-out infinite;
        }

        @keyframes headBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .avatar-outfit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 30px;
            animation: outfitRotate 3s ease-in-out infinite;
        }

        @keyframes outfitRotate {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(-1); }
        }

        .avatar-label {
            font-size: 12px;
            opacity: 0.8;
            text-align: center;
            margin-top: 10px;
        }

        /* Weather Details Grid */
        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .detail-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .detail-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .detail-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Wind Card - Prominent */
        .wind-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(100, 150, 255, 0.1));
            border: 2px solid rgba(100, 200, 255, 0.3);
        }

        .wind-card .detail-value {
            font-size: 32px;
        }

        /* Roast Section */
        .roast-section {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(59, 130, 246, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .roast-icon {
            font-size: 60px;
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .roast-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.6;
        }

        /* Recommendations */
        .recommendations {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .recommendation-card {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
        }

        .recommendation-card h3 {
            font-size: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .outfit-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .outfit-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 16px;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .outfit-item:nth-child(1) { animation-delay: 0.1s; }
        .outfit-item:nth-child(2) { animation-delay: 0.2s; }
        .outfit-item:nth-child(3) { animation-delay: 0.3s; }
        .outfit-item:nth-child(4) { animation-delay: 0.4s; }
        .outfit-item:nth-child(5) { animation-delay: 0.5s; }

        .chances-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chance-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        .chance-item:nth-child(1) { animation-delay: 0.1s; }
        .chance-item:nth-child(2) { animation-delay: 0.2s; }
        .chance-item:nth-child(3) { animation-delay: 0.3s; }
        .chance-item:nth-child(4) { animation-delay: 0.4s; }
        .chance-item:nth-child(5) { animation-delay: 0.5s; }

        .chance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .chance-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 15px;
        }

        .chance-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 10px;
        }

        .chance-percent {
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        /* Forecasts - 30 Day */
        .forecasts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .forecast-card {
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
        }

        .forecast-card h3 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .daily-forecast {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .daily-item {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .daily-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .daily-day {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .daily-icon {
            font-size: 28px;
            margin: 8px 0;
        }

        .daily-high {
            font-weight: 700;
            font-size: 16px;
        }

        .daily-low {
            opacity: 0.7;
            font-size: 14px;
        }

        .daily-rain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 12px;
            margin-top: 5px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .current-weather {
                grid-template-columns: 1fr 1fr;
            }

            .avatar-section {
                grid-column: 1 / -1;
            }

            .cities-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .current-weather {
                grid-template-columns: 1fr;
                padding: 25px;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .daily-forecast {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .roast-section {
                flex-direction: column;
                text-align: center;
            }

            .recommendations {
                grid-template-columns: 1fr;
            }

            .cities-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .avatar-container {
                width: 150px;
                height: 250px;
            }

            .avatar-head {
                font-size: 48px;
            }

            .avatar-outfit {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .weather-icon {
                font-size: 80px;
            }

            .temperature {
                font-size: 48px;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .detail-card {
                padding: 15px;
            }

            .cities-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .recommendation-card {
                padding: 20px;
            }

            .daily-forecast {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            }

            .avatar-container {
                width: 120px;
                height: 200px;
            }

            .avatar-head {
                font-size: 36px;
            }

            .avatar-outfit {
                font-size: 18px;
            }

            .roast-icon {
                font-size: 40px;
            }

            .roast-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="rain-container" id="rainContainer"></div>
        <div id="snowContainer"></div>
    </div>

    <!-- ========== CITY SELECTION SCREEN ========== -->
    <div class="city-selection" id="citySelection">
        <div class="city-selection-container">
            <div class="city-selection-header">
                <div class="city-selection-logo">🌤️</div>
                <div class="city-selection-title">Georgia Weather</div>
                <div class="city-selection-subtitle">Choose a city to see the weather forecast</div>
            </div>

            <input 
                type="text" 
                id="citySearchInput" 
                class="city-search-box" 
                placeholder="Search city..."
            >

            <div class="cities-grid" id="citiesGrid"></div>
        </div>
    </div>

    <!-- ========== WEATHER DETAIL SCREEN ========== -->
    <div class="weather-screen" id="weatherScreen">
        <div class="container">
            <button class="back-button" onclick="goBackToCities()">← Back to Cities</button>

            <!-- Current Weather -->
            <div class="current-weather" id="currentWeather">
                <div class="weather-icon" id="weatherIcon">⛅</div>
                <div class="weather-main">
                    <div class="city-name" id="cityName">Loading...</div>
                    <div class="temperature" id="temperature">-</div>
                    <div class="weather-desc" id="weatherDesc">-</div>
                    <div class="feels-like" id="feelsLike">-</div>
                </div>
                <div class="avatar-section">
                    <div class="avatar-container">
                        <div class="avatar-head">👤</div>
                        <div class="avatar-outfit" id="avatarOutfit">👕🩳</div>
                    </div>
                    <div class="avatar-label" id="avatarLabel">Your Outfit Today</div>
                </div>
            </div>

            <!-- Weather Details -->
            <div class="weather-details" id="weatherDetails"></div>

            <!-- Roast -->
            <div class="roast-section" id="roastSection">
                <div class="roast-icon" id="roastIcon">😂</div>
                <div class="roast-text" id="roastText">Loading weather roast...</div>
            </div>

            <!-- Recommendations -->
            <div class="recommendations">
                <div class="recommendation-card">
                    <h3>👕 Today's Outfit</h3>
                    <div class="outfit-items" id="outfitItems"></div>
                </div>
                <div class="recommendation-card">
                    <h3>📊 Funny Chances</h3>
                    <div class="chances-list" id="chancesList"></div>
                </div>
            </div>

            <!-- 30-Day Forecast -->
            <div class="forecasts">
                <div class="forecast-card">
                    <h3>📅 30-Day Forecast</h3>
                    <div class="daily-forecast" id="dailyForecast"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIG ==========
        const API_KEY = 'f5ec96c9efc94e1f7da114340242001';
        
        const GEORGIA_CITIES = [
            { name: 'Batumi', emoji: '🏖️' },
            { name: 'Gori', emoji: '🏛️' },
            { name: 'Kutaisi', emoji: '🌉' },
            { name: 'Senaki', emoji: '🌾' },
            { name: 'Sukhumi', emoji: '🏝️' },
            { name: 'Tbilisi', emoji: '🏙️' },
            { name: 'Telavi', emoji: '🍇' },
            { name: 'Tskaltubo', emoji: '💆' },
            { name: 'Zugdidi', emoji: '⛰️' },
            { name: 'Zestaponi', emoji: '⚙️' },
        ].sort((a, b) => a.name.localeCompare(b.name));

        let currentCity = null;

        // ========== WEATHER ICONS ==========
        const weatherIcons = {
            clear: '☀️',
            clouds: '⛅',
            rain: '🌧️',
            drizzle: '🌦️',
            thunderstorm: '⛈️',
            snow: '❄️',
            mist: '🌫️',
        };

        // ========== ROASTS ==========
        const roasts = {
            hot: [
                '🔥 "The sun woke up ANGRY today."',
                '🔥 "You\'re one step away from becoming barbecue."',
                '🔥 "Standing outside is now a cardio workout."',
                '🔥 "Even your shower has trust issues with you right now."',
                '🔥 "The pavement is basically lava at this point."',
            ],
            cold: [
                '🥶 "Your blanket misses you already."',
                '🥶 "Penguins are judging your fashion choices."',
                '🥶 "Your car engine has trust issues."',
                '🥶 "Feeling is overrated anyway."',
                '🥶 "Winter is coming... oh wait, it\'s already here."',
            ],
            rainy: [
                '🌧️ "Umbrellas are strongly recommended. Pride is optional."',
                '🌧️ "Your car is basically a submarine now."',
                '🌧️ "The weather called your shoes ugly."',
                '🌧️ "Waterproof everything."',
                '🌧️ "Noah is checking his texts."',
            ],
            cloudy: [
                '☁️ "Nature forgot to finish rendering today\'s sky."',
                '☁️ "Even the sun is lazy today."',
                '☁️ "Depression: The Weather Edition."',
                '☁️ "The sky is broken. We\'ve submitted a bug report."',
                '☁️ "Vitamin D? Never heard of her."',
            ],
            snow: [
                '❄️ "Time to walk like a penguin."',
                '❄️ "Your car is mad at you."',
                '❄️ "Frostbite speedrun any%?"',
                '❄️ "Winter wonderland or frozen nightmare? Yes."',
                '❄️ "Salt is your new best friend."',
            ],
            wind: [
                '💨 "Great day to lose your umbrella."',
                '💨 "Your hair is having a creative moment."',
                '💨 "Dorothy definitely called."',
                '💨 "Standing still is now a challenge."',
                '💨 "The wind said: No."',
            ],
        };

        // ========== OUTFIT RECOMMENDATIONS ==========
        const outfits = {
            veryHot: ['👕 T-shirt', '🩳 Shorts', '🕶 Sunglasses', '🧴 Sunscreen (SPF 50)', '👢 Sandals'],
            hot: ['👕 T-shirt/Tank top', '🩳 Shorts', '🕶 Sunglasses', '🧢 Hat', '💧 Water bottle'],
            warm: ['👔 Shirt', '🩳 Shorts/Light pants', '🕶 Sunglasses', '👟 Sneakers'],
            mild: ['👕 T-shirt', '👖 Jeans', '👟 Sneakers', '🧥 Light jacket (optional)'],
            cool: ['🧥 Jacket', '👖 Jeans', '🧣 Scarf', '👟 Sneakers', '🧤 Gloves (light)'],
            cold: ['🧥 Heavy jacket', '👖 Jeans', '🧣 Scarf', '🧤 Gloves', '🎩 Beanie'],
            veryCold: ['🧥 Winter coat', '👖 Thick jeans', '🧣 Thick scarf', '🧤 Winter gloves', '🎩 Beanie', '🧴 Lip balm'],
        };

        const rainItems = ['☔ Umbrella', '👟 Waterproof shoes'];
        const snowItems = ['⛷️ Winter coat', '🧤 Mittens', '🎿 Snow boots'];

        // ========== AVATAR OUTFITS ==========
        const avatarOutfits = {
            veryHot: '👕🩳🕶️',
            hot: '👕🩳🧢',
            warm: '👔🩳',
            mild: '👕👖',
            cool: '🧥👖',
            cold: '🧥👖🧣',
            veryCold: '🧥🎩🧤',
        };

        // ========== CHANCE ITEMS ==========
        const chanceItems = [
            { emoji: '☕', text: 'Buying Coffee' },
            { emoji: '😴', text: 'Staying in Bed' },
            { emoji: '📱', text: 'Doomscrolling' },
            { emoji: '💸', text: 'Spending Money' },
            { emoji: '🍕', text: 'Ordering Food' },
            { emoji: '🚗', text: 'Getting Stuck in Traffic' },
            { emoji: '🐕', text: 'Seeing a Dog' },
            { emoji: '🚌', text: 'Missing the Bus' },
            { emoji: '🎉', text: 'Having a Great Day' },
        ];

        // ========== UTILITY FUNCTIONS ==========
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getWeatherIcon(description) {
            description = description.toLowerCase();
            if (description.includes('clear') || description.includes('sunny')) return weatherIcons.clear;
            if (description.includes('cloud')) return weatherIcons.clouds;
            if (description.includes('rain')) return weatherIcons.rain;
            if (description.includes('drizzle')) return weatherIcons.drizzle;
            if (description.includes('thunder') || description.includes('storm')) return weatherIcons.thunderstorm;
            if (description.includes('snow')) return weatherIcons.snow;
            if (description.includes('mist') || description.includes('fog')) return weatherIcons.mist;
            return weatherIcons.clouds;
        }

        function getWeatherRoast(temp, condition, rainChance) {
            let category = 'cloudy';
            if (temp > 30) category = 'hot';
            else if (temp < 0) category = 'snow';
            else if (temp < 10) category = 'cold';
            else if (rainChance > 50) category = 'rainy';
            
            const roastList = roasts[category] || roasts.cloudy;
            return roastList[Math.floor(Math.random() * roastList.length)];
        }

        function getOutfitRecommendation(temp, rainChance) {
            let outfit = [];
            
            if (temp > 30) outfit = [...outfits.veryHot];
            else if (temp > 25) outfit = [...outfits.hot];
            else if (temp > 20) outfit = [...outfits.warm];
            else if (temp > 15) outfit = [...outfits.mild];
            else if (temp > 10) outfit = [...outfits.cool];
            else if (temp > 0) outfit = [...outfits.cold];
            else outfit = [...outfits.veryCold];
            
            if (rainChance > 50) outfit = [...outfit, ...rainItems];
            if (temp < 0) outfit = [...outfit, ...snowItems];
            
            return outfit;
        }

        function getAvatarOutfit(temp, rainChance) {
            if (temp > 30) return avatarOutfits.veryHot;
            else if (temp > 25) return avatarOutfits.hot;
            else if (temp > 20) return avatarOutfits.warm;
            else if (temp > 15) return avatarOutfits.mild;
            else if (temp > 10) return avatarOutfits.cool;
            else if (temp > 0) return avatarOutfits.cold;
            else return avatarOutfits.veryCold;
        }

        function getWindDescription(speed) {
            if (speed < 6) return '🍃 Calm';
            if (speed < 16) return '🌿 Light Breeze';
            if (speed < 31) return '💨 Moderate Breeze';
            if (speed < 51) return '🌬️ Strong Wind';
            if (speed < 76) return '🌪️ Very Strong';
            return '⚠️ Dangerous';
        }

        function getRainDescription(chance) {
            if (chance < 21) return 'Very Low';
            if (chance < 41) return 'Low';
            if (chance < 61) return 'Moderate';
            if (chance < 81) return 'High';
            return 'Very High';
        }

        function updateBackgroundTheme(condition, temp) {
            document.body.className = '';
            if (temp > 30) document.body.classList.add('sunny');
            else if (temp < 0) document.body.classList.add('snowy');
            else if (condition.toLowerCase().includes('rain')) document.body.classList.add('rainy');
            else if (condition.toLowerCase().includes('cloud')) document.body.classList.add('cloudy');
        }

        function createRainAnimation() {
            const container = document.getElementById('rainContainer');
            container.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.top = Math.random() * -100 + '%';
                drop.style.animationDelay = Math.random() * 1 + 's';
                drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                container.appendChild(drop);
            }
            container.style.opacity = '1';
        }

        function createSnowAnimation() {
            const container = document.getElementById('snowContainer');
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = ['❄', '✨', '⛄'][Math.floor(Math.random() * 3)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                snowflake.style.fontSize = (10 + Math.random() * 20) + 'px';
                container.appendChild(snowflake);
            }
        }

        // ========== FETCH WEATHER ==========
        async function fetchWeather(cityName) {
            try {
                console.log('Fetching weather for:', cityName);
                const response = await fetch(`https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${cityName}&days=30&aqi=yes`);
                if (!response.ok) throw new Error('City not found');
                
                const data = await response.json();
                displayWeather(data);
                showWeatherScreen();
            } catch (error) {
                alert('❌ Error loading weather for ' + cityName);
                console.error('Weather fetch error:', error);
            }
        }

        function displayWeather(data) {
            const current = data.current;
            const location = data.location;
            const forecast = data.forecast.forecastday;

            currentCity = location.name;

            // Current weather
            document.getElementById('cityName').textContent = location.name + ', ' + location.region;
            document.getElementById('temperature').textContent = Math.round(current.temp_c) + '°';
            document.getElementById('weatherDesc').textContent = current.condition.text;
            document.getElementById('feelsLike').textContent = `Feels like ${Math.round(current.feelslike_c)}°`;
            document.getElementById('weatherIcon').textContent = getWeatherIcon(current.condition.text);

            const rainChance = forecast[0].day.daily_chance_of_rain;
            const windSpeed = current.wind_kph;
            const rainDesc = getRainDescription(rainChance);
            const windDesc = getWindDescription(windSpeed);

            // Avatar outfit
            const avatarOutfit = getAvatarOutfit(current.temp_c, rainChance);
            document.getElementById('avatarOutfit').textContent = avatarOutfit;

            // Weather details with WIND prominently displayed
            const detailsHTML = `
                <div class="detail-card">
                    <div class="detail-icon">💧</div>
                    <div class="detail-value">${current.humidity}%</div>
                    <div class="detail-label">Humidity</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🌧️</div>
                    <div class="detail-value">${rainChance}%</div>
                    <div class="detail-label">Rain (${rainDesc})</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🔽</div>
                    <div class="detail-value">${Math.round(current.pressure_mb)}</div>
                    <div class="detail-label">Pressure (mb)</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">👁️</div>
                    <div class="detail-value">${Math.round(current.vis_km)}</div>
                    <div class="detail-label">Visibility (km)</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">☀️</div>
                    <div class="detail-value">${Math.round(current.uv)}</div>
                    <div class="detail-label">UV Index</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🌅</div>
                    <div class="detail-value" style="font-size: 16px;">${forecast[0].astro.sunrise}</div>
                    <div class="detail-label">Sunrise</div>
                </div>
                <div class="detail-card">
                    <div class="detail-icon">🌇</div>
                    <div class="detail-value" style="font-size: 16px;">${forecast[0].astro.sunset}</div>
                    <div class="detail-label">Sunset</div>
                </div>
                <div class="detail-card wind-card">
                    <div class="detail-icon">💨</div>
                    <div class="detail-value">${Math.round(windSpeed)} km/h</div>
                    <div class="detail-label">${windDesc}</div>
                </div>
            `;
            document.getElementById('weatherDetails').innerHTML = detailsHTML;

            // Roast
            const roast = getWeatherRoast(current.temp_c, current.condition.text, rainChance);
            const roastParts = roast.match(/(\S+)\s"(.+)"/);
            if (roastParts) {
                document.getElementById('roastIcon').textContent = roastParts[1];
                document.getElementById('roastText').textContent = roastParts[2];
            }

            // Outfit
            const outfit = getOutfitRecommendation(current.temp_c, rainChance);
            const outfitHTML = outfit.map(item => `<div class="outfit-item">${item}</div>`).join('');
            document.getElementById('outfitItems').innerHTML = outfitHTML;

            // Chances
            const chances = [...chanceItems].sort(() => Math.random() - 0.5).slice(0, 5);
            const chancesHTML = chances.map(item => `
                <div class="chance-item">
                    <div class="chance-label">${item.emoji} ${item.text}</div>
                    <div class="chance-bar">
                        <div class="chance-fill" style="width: ${getRandomInt(10, 95)}%"></div>
                    </div>
                    <div class="chance-percent">${getRandomInt(10, 99)}%</div>
                </div>
            `).join('');
            document.getElementById('chancesList').innerHTML = chancesHTML;

            // 30-Day Forecast
            const dailyHTML = forecast.map(day => {
                const date = new Date(day.date);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayDate = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return `
                    <div class="daily-item">
                        <div class="daily-day">${dayName}<br>${dayDate}</div>
                        <div class="daily-icon">${getWeatherIcon(day.day.condition.text)}</div>
                        <div>
                            <div class="daily-high">${Math.round(day.day.maxtemp_c)}°</div>
                            <div class="daily-low">${Math.round(day.day.mintemp_c)}°</div>
                        </div>
                        <div class="daily-rain">🌧️${day.day.daily_chance_of_rain}%</div>
                    </div>
                `;
            }).join('');
            document.getElementById('dailyForecast').innerHTML = dailyHTML;

            // Update background
            updateBackgroundTheme(current.condition.text, current.temp_c);

            // Animations
            if (rainChance > 50) {
                createRainAnimation();
            } else {
                document.getElementById('rainContainer').style.opacity = '0';
            }

            if (current.temp_c < 0) {
                createSnowAnimation();
            } else {
                document.getElementById('snowContainer').innerHTML = '';
            }
        }

        // ========== SCREEN NAVIGATION ==========
        function showWeatherScreen() {
            document.getElementById('citySelection').classList.add('hidden');
            document.getElementById('weatherScreen').classList.add('active');
        }

        function goBackToCities() {
            document.getElementById('weatherScreen').classList.remove('active');
            document.getElementById('citySelection').classList.remove('hidden');
        }

        // ========== CITY SELECTION INIT ==========
        function initializeCities() {
            const grid = document.getElementById('citiesGrid');
            const searchInput = document.getElementById('citySearchInput');

            function renderCities(cities) {
                grid.innerHTML = cities.map(city => `
                    <div class="city-card" onclick="fetchWeather('${city.name}')">
                        <div class="city-card-emoji">${city.emoji}</div>
                        <div class="city-card-name">${city.name}</div>
                    </div>
                `).join('');
            }

            renderCities(GEORGIA_CITIES);

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = GEORGIA_CITIES.filter(city => 
                    city.name.toLowerCase().includes(term)
                );
                renderCities(filtered);
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initializeCities);
    </script>
</body>
</html>
